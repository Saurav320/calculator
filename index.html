<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
@import url('https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@300;400;500;600;700&family=Laila:wght@300;400;500;600;700&display=swap');
*{
    margin:0 ;
    padding: 0;
    box-sizing:border-box ;
}
body{
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(45deg ,#0a0a0a,#3a4452);
}
.calculator{
    border: 1px solid#717377;
    padding: 20px;
    border-radius: 16px;
    background: transparent;
    box-shadow:0px 3px 15px rgba(113, 115,119,0.5) ;
}
input{
    width:320px;
    border: none;
    padding: 24px;
    margin: 10px;
    background: transparent;
    box-shadow: 0px 3px 5px rgba(84,84,84,0.1) ;
    font-size:40px;
    text-align: right;
    cursor: pointer;
    color: rgb(206, 211, 211);
}
input::placeholder{
   color:#ffffff ; 
}
button{
    border: none;
    width: 60px;
    height: 60px;
    margin:10px 4px 8px 15px;
    
    border-radius: 15px;
    background: transparent;
    color: #ffffff;
    font-size: 25px;
    box-shadow:0px 5px 8px rgba(225,255,255,0.4);
    cursor: pointer;
}
.equalBtn{
    background-color: orange;
}
.operator{
    color: aqua;
}
.operators{
    color:rgb(195, 245, 34);
    background-color: #36464a;
}
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" placeholder="0" id="inputbox">
        <div>
            <button class="operators">AC</button>
            <button class="operators">DEL</button>
            <button class="operator">%</button>
            <button class="operator">/</button>
        </div>
        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>
        </div>
        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>
        </div>
        <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
        </div>
        <div>
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button class="equalBtn">=</button>
        </div>
    </div>
<script>
    let input = document.getElementById('inputbox');
let buttons = document.querySelectorAll('button');

let string = "";
let operators = ['+', '-', '*', '/'];

buttons.forEach(btn => {
    btn.addEventListener('click', (e) => {
        let value = e.target.innerText;

        if (value === '=') {
            try {
                string = eval(string);
                input.value = string;
            } catch {
                input.value = "Error";
                string = "";
            }
        }
        else if (value === 'AC') {
            string = "";
            input.value = string;
        }
        else if (value === 'DEL') {
            string = string.slice(0, -1);
            input.value = string;
        }
        else {
            let lastChar = string[string.length - 1];

            //  block multiple operators
            if (operators.includes(value) && operators.includes(lastChar)) {
                return;
            }

            string += value;
            input.value = string;
        }
    });
});

</script></body>
</html>
